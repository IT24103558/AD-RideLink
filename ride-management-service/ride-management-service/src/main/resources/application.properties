# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8083}
spring.application.name=ride-management-service

# ===============================
# MongoDB (Atlas)
# Put the database name in the URI path, BEFORE the '?':
#   mongodb+srv://<user>:<pass>@<cluster>/ridelink_ride?retryWrites=true&w=majority
# NEVER commit a real connection string. Set MONGODB_URI as an environment variable.
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_ride}
spring.data.mongodb.auto-index-creation=true

# ===============================
# JWT - MUST be identical to the Account Service (which issues the tokens)
# ===============================
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-1234567890}

# ===============================
# Other RideLink services this service calls (REST, caller's JWT is forwarded)
# ===============================
services.driver.base-url=${DRIVER_SERVICE_URL:http://localhost:8082}
services.fare.base-url=${FARE_SERVICE_URL:http://localhost:8084}
services.timeout-ms=${SERVICES_TIMEOUT_MS:5000}

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.ridelink.rideservice=INFO
