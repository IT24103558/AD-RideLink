# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8081}
spring.application.name=account-service

# ===============================
# MongoDB (Atlas)
# NEVER commit a real connection string. Set MONGODB_URI as an environment variable.
# Use database name "ridelink_account" - this service owns that database exclusively.
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_account}
# Needed so @Indexed(unique = true) (unique email) is really created in MongoDB
spring.data.mongodb.auto-index-creation=true

# ===============================
# JWT (this service ISSUES the tokens)
# JWT_SECRET must be IDENTICAL in Account, Driver & Vehicle and Ride Management services.
# The default below equals the Driver & Vehicle Service default so they work together
# out of the box in development. Set a real secret (>= 32 chars) via JWT_SECRET otherwise.
# ===============================
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===============================
# Optional first-admin bootstrap (public registration can only create PASSENGER / DRIVER).
# If BOTH are set and no such account exists, an ADMIN account is created at start-up.
# ===============================
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.ridelink.accountservice=INFO
