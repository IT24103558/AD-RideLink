# ===============================
# Server Configuration
# Port 8084: Standard port for Fare & Payment Service
# ===============================
server.port=${SERVER_PORT:8084}
spring.application.name=fare-payment-service

# ===============================
# MongoDB Configuration
# NEVER commit credentials or real connection strings to Git.
# Set MONGODB_URI as an environment variable in local or CI deployments:
# Example: mongodb+srv://<username>:<password>@cluster0.mongodb.net/ridelink_fare_payment?retryWrites=true&w=majority
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_fare_payment}
spring.data.mongodb.auto-index-creation=true
spring.config.import=optional:file:application-local.properties,optional:file:./fare-payment-service/application-local.properties

# ===============================
# Fare Calculation Pricing Properties (Configurable Example Rates)
# Formula: Fare = Base Fare + (Distance in km * Rate per km) + (Duration in min * Rate per min)
# ===============================
fare.pricing.base-fare=${FARE_BASE_FARE:200.00}
fare.pricing.rate-per-km=${FARE_RATE_PER_KM:100.00}
fare.pricing.rate-per-minute=${FARE_RATE_PER_MINUTE:10.00}
fare.pricing.currency=${FARE_CURRENCY:LKR}
fare.pricing.multipliers.bike=${FARE_MULT_BIKE:0.8}
fare.pricing.multipliers.car=${FARE_MULT_CAR:1.0}
fare.pricing.multipliers.van=${FARE_MULT_VAN:1.5}

# ===============================
# JWT Authentication Configuration
# Shared secret with Account Service (which issues tokens for PASSENGER, DRIVER, ADMIN)
# Set JWT_SECRET in environment for production deployments
# ===============================
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-1234567890}

# ===============================
# OpenAPI / Swagger UI
# UI available at /swagger-ui/index.html or /swagger-ui.html
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===============================
# Logging
# ===============================
logging.level.com.ridelink.fareservice=INFO
