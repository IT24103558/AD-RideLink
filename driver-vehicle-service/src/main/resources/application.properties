# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8082}
spring.application.name=driver-vehicle-service

# ===============================
# MongoDB
# NEVER commit a real connection string with credentials.
# Set MONGODB_URI as an environment variable in real/CI deployments.
# ===============================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/driverdb}

# ===============================
# JWT
# The secret MUST be shared with the Account Service (which issues the tokens).
# Set JWT_SECRET as an environment variable - do not hardcode in production.
# ===============================
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-1234567890}

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===============================
# Logging
# ===============================
logging.level.com.ridelink.driverservice=INFO
